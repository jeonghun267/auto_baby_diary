name: auto_baby_diary
description: AI 기반 자동 육아일기 앱 - Vision AI + STT + LLM으로 자동 생성
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0

  # Camera & Media
  camera: ^0.11.0
  record: ^6.2.0
  image_picker: ^1.1.0
  path_provider: ^2.1.0

  # ML Kit
  google_mlkit_face_detection: ^0.11.0

  # Network
  http: ^1.2.0

  # State Management
  flutter_riverpod: ^2.5.0

  # Navigation
  go_router: ^13.0.0

  # UI
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Sharing & Auth
  share_plus: ^12.0.2
  local_auth: ^2.2.0

  # Utils
  intl: ^0.19.0
  permission_handler: ^11.3.0
  uuid: ^4.4.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.0

  # PDF & Printing
  pdf: ^3.11.0
  printing: ^5.13.0

  cupertino_icons: ^1.0.6

  # Local Notifications
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4
  ultralytics_yolo: ^0.6.4
  video_thumbnail: ^0.5.6
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/models/baby_behavior_yolov8n.tflite
    - assets/models/baby_labels.txt
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
